<form class="sorter__form">
  <label class="sorter__label" for="sortSelect">Select order: </label>
  <select class="sorter__select" [(ngModel)]="sort" name="sortSelect" (change)="onSortChange()">
    <option *ngFor="let option of sortOptions" [value]="option">
      {{ option }}
    </option>
  </select>

  <button
    [attr.aria-label]="isAsc ? 'Sort descending' : 'Sort ascending'"
    type="button"
    class="sorter__button"
    (click)="onOrderChange()"
  >
    <span
      class="sorter__chevron"
      [class.sorter__chevron--up]="isAsc"
      aria-hidden="true"
    ></span>
  </button>
</form>
